# Org-wide defaults for the scheduled AI jobs. A repo overrides any of these in the
# `config:` input of its ai-jobs caller workflow, as TOML (tables merge key by key).

# Only these people's `ai-ok` labels count. Issue text goes into a prompt and
# the repos are public, so a label from anyone else is ignored.
maintainers = ["lispandfound", "AndrewRidden-Harper", "joelridden", "claudio525", "sungeunbae"]
# The maintainer each bot PR asks for review, and each ai-serious issue is assigned to; "" for nobody.
reviewer = "lispandfound"
# The branch the jobs target; "" means the repo's default branch.
default = ""
# Arguments to `uv sync`, and the test command run after it.
sync = ["--all-extras", "--dev"]
test = "uv run --no-sync pytest tests -q -x"

# Open bot PRs at which ai-ok skips; it also keeps one PR per issue.
max_open_review_prs = 3
# Changed lines (lockfiles excluded) above which a fix is abandoned, not opened.
max_diff_lines = 300
model = "claude-opus-5-5"
timeout_minutes = 45  # per Claude run
# A repo's test command, and the CI gate (.ai/ci-checks, tests excluded), per run.
test_timeout_minutes = 60
ci_checks_timeout_minutes = 30
# Issue sweep: at most this many new issues a week, and none while this many
# `ai-suggested` issues are still open.
max_issues_per_sweep = 5
max_open_suggestions = 10
# Label low-risk sweep findings `ai-ok` straight away, so the daily fix job
# picks them up without a human triage step. Serious bugs never get it.
auto_ai_ok = true
# People @-mentioned on critical/high bugs, besides the reviewer they're assigned to.
serious_mentions = []
# Don't sweep a file again for this many days.
rotate_days = 56
# Ref of meta-ci-action whose lefthook/ci.yml gate the fixes must pass (`.ai/ci-checks`):
# the same tag repos pin their CI and lefthook.yml to.
lefthook_ref = "v2"

[budgets]  # USD per Claude run
ai-ok = 20
issue-sweep = 20
