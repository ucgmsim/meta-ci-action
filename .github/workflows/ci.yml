name: Meta CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use for setup-python steps (numpydoc job only; other jobs get their interpreter via uv)."
        type: string
        default: "3.13"
      package-dir:
        description: "Top-level package directory to lint with numpydoc, e.g. 'qcore', 'workflow', 'IM'."
        type: string
        required: true
      system-packages:
        description: "Space-separated apt packages to install before deptry/pytest/typecheck jobs (e.g. 'gmt libgmt-dev ghostscript')."
        type: string
        default: ""
      uv-extra-args:
        description: "Extra flags passed to 'uv sync' (e.g. '--all-extras --dev' or '--all-groups --all-extras')."
        type: string
        default: "--all-extras --dev"
      numpydoc-extra-excludes:
        description: "Extra '-E' fdfind exclude fragments for numpydoc lint, e.g. '-E ccldpy.py'. __init__.py is always excluded."
        type: string
        default: ""
      enable-coverage:
        description: "When true, run pytest with coverage and gate on cov-fail-under."
        type: boolean
        default: false
      cov-package:
        description: "Package name passed to '--cov='. Required when enable-coverage is true."
        type: string
        default: ""
      cov-fail-under:
        description: "Coverage percentage threshold passed to 'coverage report --fail-under='."
        type: number
        default: 95

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: "uv.lock"
      - name: ruff format --check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: "uv.lock"
          args: "format --check"

  deptry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - if: inputs.system-packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ inputs.system-packages }}
      - run: uv sync ${{ inputs.uv-extra-args }}
      - run: uv run deptry .

  numpydoc-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: fd-find
          version: "1.0"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install numpydoc
      - run: >
          fdfind . ${{ inputs.package-dir }}/ -E "__init__.py"
          ${{ inputs.numpydoc-extra-excludes }} --extension py | xargs numpydoc lint

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: inputs.system-packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ inputs.system-packages }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync ${{ inputs.uv-extra-args }}
      - name: Run tests
        if: ${{ !inputs.enable-coverage }}
        run: uv run pytest tests
      - name: Run tests with coverage
        if: ${{ inputs.enable-coverage }}
        run: uv run pytest --cov=${{ inputs.cov-package }} --cov-report=html tests
      - name: Report and gate coverage
        if: ${{ inputs.enable-coverage }}
        run: |
          uv run coverage html --skip-covered --skip-empty
          uv run coverage report | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
          uv run coverage report --fail-under=${{ inputs.cov-fail-under }}
      - name: Upload HTML report if coverage check failed
        if: ${{ inputs.enable-coverage && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: htmlcov

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: inputs.system-packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ inputs.system-packages }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync ${{ inputs.uv-extra-args }}
      - run: uv run ty check
