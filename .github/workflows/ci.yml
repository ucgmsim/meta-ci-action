name: Meta CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use for setup-python steps (docstring job only; other jobs get their interpreter via uv). It parses the code under test, so it must be at least as new as the syntax that code uses."
        type: string
        default: "3.13"
      package-dir:
        description: "Top-level package directory to lint for docstrings, e.g. 'qcore', 'workflow', 'IM'. Optional now that npdlint reads '[tool.npdlint] include' from pyproject.toml; leave it unset once that is configured."
        type: string
        default: ""
      system-packages:
        description: "Space-separated apt packages to install before deptry/pytest/typecheck jobs (e.g. 'gmt libgmt-dev ghostscript')."
        type: string
        default: ""
      uv-extra-args:
        description: "Extra flags passed to 'uv sync' (e.g. '--all-extras --dev' or '--all-groups --all-extras'). Maturin repos can add '-C build-args=--profile=dev' here to skip optimised Rust builds."
        type: string
        default: "--all-extras --dev"
      numpydoc-extra-excludes:
        description: "Deprecated. Extra '-E' fdfind exclude fragments, e.g. '-E ccldpy.py', kept working so callers written for the old pipeline need no edit; each becomes an npdlint '--extend-exclude'. Prefer '[tool.npdlint] extend-exclude' in pyproject.toml."
        type: string
        default: ""
      exclude-init:
        description: "Skip __init__.py in the docstring job, as the old fdfind pipeline always did. Set false once '[tool.npdlint]' owns the exclusions and you want them linted too."
        type: boolean
        default: true
      pytest-paths:
        description: "Paths passed to pytest. Leave empty to let '[tool.pytest.ini_options] testpaths' decide."
        type: string
        default: "tests"
      rust-features:
        description: "Space-separated cargo feature sets; each gets its own 'cargo test --features <set>' run. Only used when a Cargo.toml is present."
        type: string
        default: ""
      rust-test-release:
        description: "Also run 'cargo test --release' in the rust job. Debug and release builds can disagree under optimization (e.g. LLVM folding 'powf(x, 0.5)' into 'sqrt(x)' at -O2 but not at -O0), so a crate whose compiled extension does numeric work may want both profiles tested. Off by default, since it roughly doubles the rust job's runtime."
        type: boolean
        default: false
      enable-coverage:
        description: "When true, run pytest with coverage and gate on cov-fail-under."
        type: boolean
        default: false
      cov-package:
        description: "Package name passed to '--cov='. Required when enable-coverage is true."
        type: string
        default: ""
      cov-fail-under:
        description: "Coverage percentage threshold passed to 'coverage report --fail-under='."
        type: number
        default: 95

jobs:
  # Gate for the Rust jobs and steps below. hashFiles() is not available in a
  # job-level `if:`, so presence of a Cargo.toml is detected in a real job and
  # published as an output. Pure-Python repos pay one ~10s no-op job for this.
  detect:
    runs-on: ubuntu-latest
    outputs:
      has-rust: ${{ steps.cargo.outputs.has-rust }}
    steps:
      - uses: actions/checkout@v4
      - id: cargo
        shell: bash
        run: |
          if [ -n "$(find . -name Cargo.toml -not -path './target/*' -print -quit)" ]; then
            echo "has-rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-rust=false" >> "$GITHUB_OUTPUT"
          fi

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: "uv.lock"
      - name: ruff format --check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: "uv.lock"
          args: "format --check"

  deptry:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.detect.outputs.has-rust == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.detect.outputs.has-rust == 'true'
        uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - if: inputs.system-packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ inputs.system-packages }}
      - run: uv sync ${{ inputs.uv-extra-args }}
      - run: uv run --no-sync deptry .

  # Docstrings, via npdlint. It walks the tree itself and reads its rules from
  # [tool.npdlint], so the fd-find + xargs pipeline this used to be — and the
  # apt install it needed — are gone. The job keeps its name so that branch
  # protection rules naming it as a required check do not have to change.
  numpydoc-lint:
    runs-on: ubuntu-latest
    env:
      PACKAGE_DIR: ${{ inputs.package-dir }}
      EXTRA_EXCLUDES: ${{ inputs.numpydoc-extra-excludes }}
      EXCLUDE_INIT: ${{ inputs.exclude-init }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install npdlint
      - name: npdlint check
        # The inputs are read from the environment rather than interpolated
        # into the script, so a caller cannot inject shell through them.
        run: |
          args=()
          if [ -n "$PACKAGE_DIR" ]; then
            args+=("$PACKAGE_DIR")
          fi
          if [ "$EXCLUDE_INIT" = "true" ]; then
            args+=(--extend-exclude "**/__init__.py")
          fi
          if [ -n "$EXTRA_EXCLUDES" ]; then
            echo "::warning::numpydoc-extra-excludes is deprecated;" \
              "move these patterns to [tool.npdlint] extend-exclude."
            # fdfind spelled each exclusion '-E <pattern>'; npdlint takes the
            # same gitignore-style pattern behind --extend-exclude.
            for token in $EXTRA_EXCLUDES; do
              if [ "$token" != "-E" ]; then
                args+=(--extend-exclude "$token")
              fi
            done
          fi
          npdlint check "${args[@]}" --output-format github --statistics

  # Rust equivalent of the ruff/pytest/typecheck jobs: only runs for repos that
  # actually ship a crate.
  rust:
    needs: detect
    if: needs.detect.outputs.has-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: inputs.system-packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ inputs.system-packages }}
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      - name: cargo test --release
        if: inputs.rust-test-release
        run: cargo test --release
      - name: cargo test (extra feature sets)
        if: inputs.rust-features != ''
        env:
          RUST_FEATURES: ${{ inputs.rust-features }}
        run: |
          for feature_set in $RUST_FEATURES; do
            cargo test --features "$feature_set"
          done
      - name: cargo doc-tests
        run: cargo test --doc

  pytest:
    needs: detect
    runs-on: ubuntu-latest
    env:
      PYTEST_PATHS: ${{ inputs.pytest-paths }}
    steps:
      - uses: actions/checkout@v4
      - if: inputs.system-packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ inputs.system-packages }}
      - if: needs.detect.outputs.has-rust == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.detect.outputs.has-rust == 'true'
        uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync ${{ inputs.uv-extra-args }}
      - name: Run tests
        if: ${{ !inputs.enable-coverage }}
        run: uv run --no-sync pytest $PYTEST_PATHS
      - name: Run tests with coverage
        if: ${{ inputs.enable-coverage }}
        run: uv run --no-sync pytest --cov=${{ inputs.cov-package }} --cov-report=html $PYTEST_PATHS
      - name: Report and gate coverage
        if: ${{ inputs.enable-coverage }}
        run: |
          uv run --no-sync coverage html --skip-covered --skip-empty
          uv run --no-sync coverage report | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
          uv run --no-sync coverage report --fail-under=${{ inputs.cov-fail-under }}
      - name: Upload HTML report if coverage check failed
        if: ${{ inputs.enable-coverage && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: htmlcov

  typecheck:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: inputs.system-packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ inputs.system-packages }}
      - if: needs.detect.outputs.has-rust == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.detect.outputs.has-rust == 'true'
        uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync ${{ inputs.uv-extra-args }}
      - run: uv run --no-sync ty check
