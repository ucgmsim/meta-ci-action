name: AI test improver

# Each run mutation-tests source files with mutmut, starting from a different file each
# day, and takes the first with enough surviving mutants: changes to the code the tests
# don't notice. Claude writes tests that kill them (and cover the file's uncovered lines),
# as one tests-only PR. A bug the tests turn up is filed as an issue instead.
# Called daily from each repo's .github/workflows/ai.yml; see the README.

on:
  workflow_call:
    inputs:
      cov-package:
        description: "Package measured for coverage ('--cov='), e.g. 'workflow'. The files it measures are the candidate targets."
        type: string
        required: true
      pytest-paths:
        description: "Paths passed to pytest for the coverage and mutation runs."
        type: string
        default: "tests"
      min-mutants:
        description: "A file is a target once mutmut finds this many mutants that survive or that no test runs."
        type: number
        default: 5
      mutation-timeout-minutes:
        description: "Time limit for mutmut, across all the files tried in a run."
        type: number
        default: 40
      reviewer:
        description: "GitHub user asked to review the PR. Empty for nobody."
        type: string
        default: "lispandfound"
      system-packages:
        description: "Space-separated apt packages the repo's tests need (as for ci.yml)."
        type: string
        default: ""
      uv-extra-args:
        description: "Flags passed to 'uv sync'."
        type: string
        default: "--all-extras --dev"
      test-command:
        description: "The repo's test command."
        type: string
        default: "uv run --no-sync pytest tests -q -x"
      model:
        type: string
        default: "claude-opus-5-5"
      max-turns:
        type: number
        default: 150
    secrets:
      claude_code_oauth_token:
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    outputs:
      go: ${{ steps.open.outputs.go }}
    steps:
      # One tests PR at a time, whatever branch it's on: Claude may not have used ai/tests.
      - id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=$GITHUB_REPOSITORY
          gh label create ai-generated -R "$R" --force --color 5319e7 --description "Opened by the scheduled Claude jobs"
          gh label create ai-tests -R "$R" --force --color bfd4f2 --description "AI-written tests that need review"
          gh label create ai-suggested -R "$R" --force --color d4c5f9 --description "Filed by the scheduled Claude jobs"
          gh label create ai-ok -R "$R" --force --color 0e8a16 --description "Vetted: the AI issue solver may attempt a fix"
          url=$(gh pr list -R "$R" --label ai-tests --state open --json url --jq '.[0].url // empty')
          [ -n "$url" ] && echo "the last tests PR is still open: $url"
          echo "go=$([ -z "$url" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  improve:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write  # the Claude GitHub App's token, which Claude pushes and opens the PR with
    steps:
      # Don't leave the read-only GITHUB_TOKEN in git config: checkout v6 keeps it behind an
      # includeIf entry that claude-code-action doesn't clear, so it overrides the Claude
      # App token and pushes fail with 403 as github-actions[bot].
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - if: inputs.system-packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ inputs.system-packages }}
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv sync ${{ inputs.uv-extra-args }}
          printf '.ai/\nmutants/\n' >> .git/info/exclude
          mkdir -p .ai

      # Coverage gives the candidate files (whatever layout the package has) and, for the
      # target, the lines Claude should also cover.
      - name: Measure coverage
        env:
          COV_PACKAGE: ${{ inputs.cov-package }}
          PYTEST_PATHS: ${{ inputs.pytest-paths }}
        run: |
          uv run --no-sync --with pytest-cov pytest $PYTEST_PATHS -q -p no:cacheprovider \
            --cov="$COV_PACKAGE" --cov-report=json:.ai/coverage.json --cov-report=term-missing:skip-covered \
            > .ai/coverage.txt || true
          if [ ! -s .ai/coverage.json ]; then tail -50 .ai/coverage.txt; echo "::error::the coverage run produced no report"; exit 1; fi
          tail -3 .ai/coverage.txt

      # Picking by coverage stalls once a repo is well covered, and sticks on a file whose
      # last few lines can't be tested. Instead, walk the source files from a start that
      # moves on a file each day, mutation-test each with mutmut, and stop at the first
      # with enough survivors. A file the last PR made solid is passed over the next time
      # round. mutmut's config goes into pyproject.toml for the run; it copies the whole
      # checkout into mutants/, as tests can load files outside the package (e.g. scripts/).
      - name: Pick the target by surviving mutants
        id: target
        env:
          PYTEST_PATHS: ${{ inputs.pytest-paths }}
          MIN: ${{ inputs.min-mutants }}
          MINUTES: ${{ inputs.mutation-timeout-minutes }}
        run: |
          if grep -q '^\[tool.mutmut\]' pyproject.toml; then
            echo "::error::the repo has its own [tool.mutmut] config, which the test improver would clash with"
            exit 1
          fi
          jq -r '.files | to_entries
            | map(select((.key | test("(^|/)(tests?/|test_|conftest)") | not) and .value.summary.num_statements > 0))
            | .[].key' .ai/coverage.json | sort > .ai/candidates.txt
          n=$(wc -l < .ai/candidates.txt)
          if [ "$n" -eq 0 ]; then echo "::error::coverage measured no source files"; exit 1; fi
          start=$(( $(date -u +%s) / 86400 % n ))
          { tail -n +"$((start + 1))" .ai/candidates.txt; head -n "$start" .ai/candidates.txt; } > .ai/order.txt
          echo "$n candidate files; starting at $(head -1 .ai/order.txt)"

          cp pyproject.toml .ai/pyproject.toml.orig
          paths=$(printf '%s\n' $PYTEST_PATHS | jq -Rnc '[inputs | select(. != "")]')
          copy=$(git ls-files | cut -d/ -f1 | sort -u | jq -Rnc '[inputs | select(. != "")]')
          mutmut="uv run --no-sync --with mutmut mutmut"
          deadline=$(( $(date +%s) + MINUTES * 60 ))
          tried=0 broken=0 target=
          while read -r f <&3; do
            left=$(( deadline - $(date +%s) ))
            if [ "$left" -lt 120 ]; then echo "out of time after $tried files"; break; fi
            tried=$((tried + 1))
            cp .ai/pyproject.toml.orig pyproject.toml
            printf '\n[tool.mutmut]\nsource_paths = ["%s"]\nonly_mutate = ["%s"]\npytest_add_cli_args_test_selection = %s\nalso_copy = %s\n' \
              "${f%%/*}" "$f" "$paths" "$copy" >> pyproject.toml
            rm -rf mutants
            if ! timeout "$left" $mutmut run < /dev/null > .ai/mutmut-run.txt 2>&1; then
              echo "mutmut ended early on $f; its last lines:"; tail -5 .ai/mutmut-run.txt
            fi
            $mutmut results --all true > .ai/mutmut-results.txt 2>&1 || true
            # "no tests": no test even runs the mutated code.
            grep -oP '^\s*\K\S+(?=: (survived|no tests)$)' .ai/mutmut-results.txt > .ai/survived.txt || true
            grep -qP ':\s*(killed|survived|no tests|timeout|suspicious)$' .ai/mutmut-results.txt || broken=$((broken + 1))
            count=$(wc -l < .ai/survived.txt)
            echo "$f: $count surviving or untested mutants"
            if [ "$count" -ge "$MIN" ]; then
              target=$f
              head -25 .ai/survived.txt | while read -r m; do $mutmut show "$m" < /dev/null || true; echo; done > .ai/survivors.txt
              break
            fi
          done 3< .ai/order.txt
          mv .ai/pyproject.toml.orig pyproject.toml
          rm -rf mutants
          if [ -z "$target" ]; then
            if [ "$tried" -gt 0 ] && [ "$broken" -eq "$tried" ]; then
              echo "::error::mutmut checked no mutants in any of the $tried files tried; see the output above"
              exit 1
            fi
            echo "none of the $tried files tried has $MIN or more surviving mutants"
            exit 0
          fi
          jq -r --arg t "$target" '.files[$t] | "\(.summary.percent_covered | floor)% covered; uncovered lines: \(.missing_lines | map(tostring) | join(", ") | if . == "" then "none" else . end)"' \
            .ai/coverage.json > .ai/target-coverage.txt
          echo "target: $target ($count mutants; $(cat .ai/target-coverage.txt))"
          echo "file=$target" >> "$GITHUB_OUTPUT"

      - id: claude
        if: steps.target.outputs.file != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          prompt: |
            You are strengthening the tests of ${{ github.repository }}, unattended. Nobody
            will answer questions. Your output is one tests-only pull request.

            Target: `${{ steps.target.outputs.file }}`. Mutation testing changed it in small
            ways ("mutants"), and the test suite still passed for each of those in
            .ai/survivors.txt (up to 25 of them), or no test ran the mutated code at all: no
            test checks the behaviour those mutants broke. Its coverage is in
            .ai/target-coverage.txt.

            1. Read CLAUDE.md if it exists, then the target file and its existing tests.
            2. For each surviving mutant, decide whether the change matters. Some are
               equivalent to the original (a bound that can never be reached, a log message);
               skip those. For the rest, write tests that would fail under the mutant and pass
               on the real code: exact values, boundary cases, error conditions.
            3. Cover the target's uncovered lines too, where a test can reach them. Test
               through the public behaviour of the code: real inputs, meaningful assertions
               on outputs, errors raised for invalid inputs. Don't write tests that only
               execute a line without checking anything. Prefer a few thorough tests over
               many shallow ones, and follow the existing test style, fixtures and
               hypothesis usage.
            4. Only add or change files under tests/ (including conftest.py). Never edit the
               code under test. If a line can only be covered by changing the code, leave it.
            5. Run the tests: `${{ inputs.test-command }}`. They must pass. Check coverage of
               the target didn't fall:
               `uv run --no-sync --with pytest-cov pytest ${{ inputs.pytest-paths }} -q --cov=${{ inputs.cov-package }} --cov-report=term-missing`.
               CI type-checks tests too: if a test deliberately passes input outside a type
               hint, add a targeted `# ty: ignore[<rule>]` on that line saying why.
            6. If a correct test shows the code is wrong (it crashes on valid input, returns
               something its docstring says it shouldn't, or a mutant is *more* correct than
               the original), don't write a test that locks in the wrong behaviour. First
               check it hasn't been raised before, open or closed
               (`gh issue list --state all --search "<keywords>"`), then file it:
               `gh issue create --title "<title>" --body-file .ai/bug.md --label ai-suggested --label ai-ok`,
               with the location, a minimal reproducer and the expected versus actual result.
               Keep going with the rest of the tests.
            7. Open the PR:
               - `git switch -c ai/tests`, commit, and `git push --force -u origin ai/tests`.
                 No open PR uses that branch (the run checked), so overwrite one left on the
                 remote rather than picking another name. Put scratch files under .ai/ only
                 (it is git-ignored).
               - Write .ai/pr-body.md: the target file, what behaviour the new tests pin down, the target's
                 coverage before and after, which mutants the tests kill and which you judged
                 equivalent and why, and any issue you filed.
               - `gh pr create --title "<imperative, under 70 characters>" --body-file .ai/pr-body.md --label ai-generated,ai-tests`,
                 adding `--reviewer ${{ inputs.reviewer }}` if "${{ inputs.reviewer }}" isn't empty.

            If there is nothing worth testing (the lines are unreachable or trivially
            defensive, and every surviving mutant is equivalent), open no PR and say why.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(uv run:*),Bash(cargo test:*),Bash(git:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh pr list:*),Bash(gh pr create:*)"

      # Claude's own output is hidden from the log; put its final message, and any tool
      # calls the allowlist refused, in the job summary so a run that did nothing says why,
      # and in the log too, as the API (`gh run view --log`) can't read job summaries.
      - name: Summarise Claude's run
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "result")
            | "### Claude: \(.subtype), \(.num_turns) turns, $\(.total_cost_usd * 100 | round / 100)\n\n\(.result // "(no final message)")\n"
              + (if (.permission_denials // []) == [] then "" else
                 "\nRefused tool calls:\n\n" + (.permission_denials | map("- \(.tool_name): `\(.tool_input | tojson | .[:200])`") | join("\n")) end)' \
            "$LOG" | tee -a "$GITHUB_STEP_SUMMARY"
