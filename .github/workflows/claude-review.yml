name: Claude PR Review

# Reusable workflow — the triggers live in each consuming repo's own thin
# wrapper, NOT here. This file only runs when called via `uses:` from it:
#
#   on:
#     issue_comment:            # "@claude review" on any PR, on demand
#       types: [created]
#     pull_request:             # automatic, once, when a human's PR is ready
#       types: [opened, ready_for_review]
#
# The pull_request trigger reviews a PR when it is opened ready for review or
# taken out of draft, not on every push. It skips drafts, PRs opened by bots
# (Dependabot, the AI jobs) and PRs from forks, which get no secrets on that
# event; "@claude review" still works on all of them.
on:
  workflow_call:
    secrets:
      claude_code_oauth_token:
        required: true

jobs:
  review:
    # A "@claude review" comment on a PR, or a human's same-repo PR that is
    # ready for review.
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude review')) ||
      (github.event_name == 'pull_request' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.user.type == 'User' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # A second review request cancels the in-flight one instead of running both.
    concurrency:
      group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read          # read-only: this bot reviews, it does not push
      pull-requests: write    # post review comments
      issues: write           # post the tracking comment
      id-token: write         # required for Claude GitHub App auth
      actions: read           # let Claude read CI results
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0      # full history; the action checks out the PR head itself

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

            Review this pull request for correctness bugs: logic errors,
            security vulnerabilities, broken edge cases, and regressions.
            Prioritise defects over style. Follow REVIEW.md and CLAUDE.md
            if present in the repo.

            First, read the existing review comments on this PR. This may be a
            repeat review — do not re-report findings you already posted that
            are still unaddressed, and do not restate findings the author has
            already replied to. Report only what is new or newly broken.

            Use `mcp__github_inline_comment__create_inline_comment` with
            `confirmed: true` for line-specific findings. Post a short summary
            comment with the finding count by severity. Do not modify code,
            do not push commits, do not approve or request changes.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*)"
