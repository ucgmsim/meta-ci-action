name: AI jobs

# Scheduled issue work by Claude, as the org's GitHub App (ucgmsim[bot]): a weekly sweep
# that files vetted issues, and a daily fix for the oldest issue a maintainer labelled ai-ok.
# Each repo calls this from a thin .github/workflows/ai-jobs.yml with a daily cron; see
# ai-jobs/README.md. The job code is ai-jobs/aij.

on:
  workflow_call:
    inputs:
      jobs:
        description: "Space-separated jobs to run now: 'issue-sweep', 'ai-ok' or both. Empty runs today's: ai-ok every day, after issue-sweep on Sundays (Auckland time)."
        type: string
        default: ""
      live:
        description: "Push branches, open PRs and file issues. When false, the patches, PR text and issues are only uploaded in the run's artifacts."
        type: boolean
        default: true
      issue:
        description: "ai-ok: work on this issue number regardless of its labels (a trial). Empty or 0 picks the oldest eligible ai-ok issue."
        type: string
        default: "0"
      config:
        description: "TOML overriding ai-jobs/aij/defaults.toml for this repo: test command, uv sync args, reviewer, budgets and limits."
        type: string
        default: ""
      system-packages:
        description: "Space-separated apt packages the repo's tests need (as for ci.yml)."
        type: string
        default: ""
      meta-ref:
        description: "Ref of meta-ci-action whose job code runs. Keep it the same as the ref in the caller's 'uses:'."
        type: string
        default: "v2"
    secrets:
      AI_JOBS_APP_ID:
        required: true
      AI_JOBS_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

env:
  CLAUDE_VERSION: "2.1.283"
  AIJ_DATA: ${{ github.workspace }}/.aij  # clones, logs and rotation state

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - id: plan
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          if [ -z "$JOBS" ]; then
            JOBS=ai-ok
            # Sundays: the sweep too.
            [ "$(TZ=Pacific/Auckland date +%u)" = 7 ] && JOBS="issue-sweep ai-ok"
          fi
          echo "jobs=$(printf '%s\n' $JOBS | jq -Rnc '[inputs | select(. != "")]')" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      # One job at a time, so each sees the PRs the last one opened (the review-PR cap)
      # and Claude spend stays predictable.
      max-parallel: 1
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    name: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ucgmsim/meta-ci-action
          ref: ${{ inputs.meta-ref }}
          path: .meta-ci-action
          persist-credentials: false

      - if: inputs.system-packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ inputs.system-packages }}

      - uses: astral-sh/setup-uv@v6

      # For repos with a crate: the tests and the CI gate build it, and run clippy and rustfmt.
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Install the job code and Claude Code
        run: |
          M=$GITHUB_WORKSPACE/.meta-ci-action/ai-jobs
          {
            echo "AIJ_HOME=$M"
            echo "AIJ_VENV=$RUNNER_TEMP/aij-venv"
            echo "AIJ_REAL_GH=$(command -v gh)"
          } >> "$GITHUB_ENV"
          uv venv -q --python 3.13 "$RUNNER_TEMP/aij-venv"
          uv pip install -q --python "$RUNNER_TEMP/aij-venv/bin/python" "ruamel.yaml>=0.18" "pyjwt[crypto]>=2.8"
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$M/bin" >> "$GITHUB_PATH"  # added last, so its gh comes first
          mkdir -p "$AIJ_DATA/state"

      - name: Set git up as the GitHub App
        env:
          AIJ_GH_APP_ID: ${{ secrets.AI_JOBS_APP_ID }}
          AIJ_GH_APP_KEY: ${{ secrets.AI_JOBS_APP_PRIVATE_KEY }}
        run: |
          { read -r name; read -r email; } < <(aij gh-app identity)
          git config --global user.name "$name"
          git config --global user.email "$email"
          git config --global credential.https://github.com.helper ''
          git config --global --add credential.https://github.com.helper '!gh auth git-credential'

      # Which files issue-sweep reviewed recently. Every job saves a new entry, so the daily
      # ai-ok runs keep the cache fresh between the weekly sweeps.
      - uses: actions/cache/restore@v4
        with:
          path: .aij/state
          key: ai-jobs-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.job }}
          restore-keys: ai-jobs-state-

      - name: aij run ${{ matrix.job }}
        env:
          AIJ_GH_APP_ID: ${{ secrets.AI_JOBS_APP_ID }}
          AIJ_GH_APP_KEY: ${{ secrets.AI_JOBS_APP_PRIVATE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AIJ_CONFIG: ${{ inputs.config }}
          JOB: ${{ matrix.job }}
          LIVE: ${{ inputs.live }}
          ISSUE: ${{ inputs.issue }}
        run: aij run "$JOB" --live="$LIVE" --issue="$ISSUE"

      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .aij/state
          key: ai-jobs-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.job }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-jobs-${{ matrix.job }}
          path: .aij/logs
          retention-days: 30
          if-no-files-found: ignore
